name: vendify_pos
description: VendifyPOS - Cross-platform Point of Sale for VendifyERP
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  provider: ^6.1.2
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  cupertino_icons: ^1.0.8
  badges: ^3.1.2
  intl: ^0.20.2
  connectivity_plus: ^6.1.0
  mobile_scanner: ^5.2.3
  barcode_widget: ^2.0.4
  printing: ^5.13.4
  pdf: ^3.11.2
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.16.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/

msix_config:
  display_name: Vendify POS
  publisher_display_name: ARK Soft Solutions
  identity_name: ARKSoftSolutions.VendifyPOS
  msix_version: 1.1.0.0
  logo_path: assets/images/vendify_logo.png
  capabilities: internetClient

  certificate_path: certificates/vendifyPOS.pfx
  certificate_password: ''